spring:
  application:
    name: Role
  datasource:
    url: jdbc:postgresql://localhost:5435/role
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html